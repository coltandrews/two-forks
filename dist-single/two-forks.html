<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Forks</title>
<meta name="description" content="A cozy co-op restaurant game for up to four laptops. Cook, serve, set prices and read the P&amp;L together.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a6ea8'/%3E%3Cpath d='M12 11v14m4-14v14m4-14v14m4-14v14M12 25c0 5 2.5 8 6 8s6-3 6-8M18 33v20M40 11v14m4-14v14m4-14v14m4-14v14M40 25c0 5 2.5 8 6 8s6-3 6-8M46 33v20' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Two Forks: warm paper, clear controls, and a compact in-game HUD. */
:root {
  --ink: #2a1b12;
  --ink-2: #5b4333;
  --ink-3: #8a6f5c;
  --cream: #fff8ea;
  --cream-2: #ffeccb;
  --cream-3: #f4d6a6;
  --wood: #8a5530;
  --wood-dark: #5a3419;
  --red: #ef4b3f;
  --red-d: #b8322a;
  --yellow: #ffc83c;
  --yellow-d: #d69a12;
  --green: #45c463;
  --green-d: #2b8c45;
  --blue: #3d9bff;
  --blue-d: #2167c8;
  --pink: #ff7aa8;
  --purple: #9b6cf2;
  --accent: #ef4b3f;
  --accent-dark: #2a1b12;
  --good: var(--green-d);
  --mid: var(--yellow-d);
  --bad: var(--red);
  --line: rgba(42, 27, 18, 0.18);
  --outline: 3px solid var(--ink);
  --pop: 0 4px 0 var(--ink);
  --shadow: 0 5px 0 var(--ink), 0 12px 26px rgba(20, 10, 4, 0.32);
  --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: 'Nunito', system-ui, sans-serif;
  --mono: 'Courier Prime', ui-monospace, monospace;
  --radius: 16px;
  --menu-width: 480px;
  /* Old names some markup still uses. */
  --paper: var(--cream);
  --paper-2: var(--cream-2);
  --paper-3: var(--cream-3);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1410; color: var(--ink); font: 600 15px/1.35 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
#app { position: fixed; inset: 0; overflow: hidden; }
#game-canvas { position: absolute; inset: 0; display: block; }
#boot { position: absolute; inset: 0; display: grid; place-items: center; color: var(--yellow); font: 2rem var(--display); background: #1c1410; z-index: 50; letter-spacing: 0.02em; }

kbd {
  display: inline-grid; place-items: center; min-width: 1.85em; height: 1.85em; padding: 0 0.45em; border-radius: 7px;
  background: #fff; color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  font: 0.82em/1 var(--display); letter-spacing: 0.02em; transform: translateY(-1px);
}

/* ---------------------------------------------------------- buttons */
.btn {
  border: var(--outline); border-radius: 12px; padding: 0.55em 1.05em; background: #fff; color: var(--ink);
  font: 1rem/1.1 var(--display); letter-spacing: 0.02em; box-shadow: var(--pop); transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
}
.btn:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.btn.go { background: var(--green); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.btn.ghost { background: var(--cream-2); }
.btn.small { padding: 0.35em 0.75em; font-size: 0.88rem; border-radius: 10px; }
.btn.on { background: var(--green); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: var(--pop); filter: grayscale(0.4); }
.icon-btn { border: 2px solid transparent; background: transparent; padding: 3px 8px; border-radius: 9px; color: var(--ink-2); font-weight: 800; }
.icon-btn:hover { background: var(--cream-2); border-color: var(--ink); }

.panel { background: var(--cream); border: var(--outline); border-radius: var(--radius); box-shadow: var(--shadow); }

/* ---------------------------------------------------------- markers over the 3D scene */
#markers { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.mk { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
.ring {
  --p: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; margin-top: -4px;
  background: conic-gradient(var(--rc, var(--yellow)) calc(var(--p) * 1%), #fff 0); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.ring::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--ink); }
.ring > * { position: relative; }
.ring svg { width: 17px; height: 17px; color: #fff; position: relative; }
.ring b { position: relative; color: #fff; font: 15px var(--display); }
.ring.cooking { --rc: var(--yellow); }
.ring.chop { --rc: var(--blue); }
.ring.done { --rc: var(--green); --p: 100; }
.ring.done::before { background: var(--green-d); }
.ring.warn { --rc: var(--red); animation: pulse 0.45s ease-in-out infinite alternate; }
.ring.warn::before { background: var(--red-d); }
.ring.burnt { background: #222; }
.ring.burnt::before { background: #111; }
@keyframes pulse { from { scale: 1; } to { scale: 1.2; } }

.badge {
  padding: 2px 9px; border-radius: 99px; background: #fff; color: var(--ink); border: 2.5px solid var(--ink);
  font: 13px/1.3 var(--display); letter-spacing: 0.02em; box-shadow: 0 3px 0 var(--ink);
}
.badge.low { background: var(--red); color: #fff; animation: pulse 0.6s ease-in-out infinite alternate; }
.badge.sinkb { background: linear-gradient(90deg, #8fd0ff calc(var(--p) * 1%), #fff 0); }
.badge.dockb { background: var(--yellow); }
.badge.well { background: var(--cream-2); }
.tnum {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff;
  font: 13px var(--display); border: 2px solid #fff; opacity: 0.88;
}
.bubble {
  display: flex; align-items: center; gap: 6px; padding: 5px 11px 10px 7px; border-radius: 14px; background: #fff; color: var(--ink);
  font: 800 13px/1.15 var(--body); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); position: absolute; margin-top: -10px;
}
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; background: inherit; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) rotate(45deg); }
.bubble .ic { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--cream-2); border: 2px solid var(--ink); flex: none; }
.bubble .ic svg { width: 15px; height: 15px; }
.bubble em { font: 11px var(--display); font-style: normal; background: var(--ink); color: var(--yellow); padding: 1px 6px; border-radius: 5px; letter-spacing: 0.04em; }
.bubble.quiet { opacity: 0.85; background: var(--cream); }
.bubble.call { background: var(--yellow); animation: bob 0.8s ease-in-out infinite; }
.bubble.call .ic { background: #fff; }
.bubble.call.pay { background: #8ee68f; }
.bubble.wait .ic { background: var(--cream-3); }
.bubble.dirty { background: #e9d6be; }
.bubble.angry { background: #ffb3a8; }
.bubble.angry .ic { background: var(--red); color: #fff; }
.bubble.small { font-size: 12px; padding: 3px 9px 8px 5px; }
.bubble.small .ic { width: 20px; height: 20px; }
.bubble.host { background: #ffe18a; }
.bubble .mood { position: absolute; left: 9px; right: 9px; bottom: 3px; height: 4px; border-radius: 3px; background: rgba(42, 27, 18, 0.15); overflow: hidden; }
.bubble .mood::before { content: ''; position: absolute; inset: 0; width: var(--m); background: var(--green); border-radius: 3px; transition: width 0.4s; }
.bubble .mood.mid::before { background: var(--yellow-d); }
.bubble .mood.bad::before { background: var(--red); }
.bubble .wp { position: absolute; left: -3px; bottom: -14px; height: 6px; background: var(--blue); border: 2px solid var(--ink); border-radius: 4px; }
@keyframes bob { 50% { translate: 0 -4px; } }
.bubble.say { max-width: 240px; white-space: normal; text-align: center; padding: 6px 12px 9px; font: 800 14px/1.25 var(--body); overflow-wrap: anywhere; z-index: 2; animation: sayIn 0.22s cubic-bezier(.3,1.6,.6,1); transition: opacity 0.4s; }
.bubble.say.fading { opacity: 0; }
@keyframes sayIn { from { scale: 0.6; opacity: 0; } }
.chat-box { position: absolute; left: 50%; bottom: 96px; translate: -50% 0; z-index: 20; width: min(480px, calc(100% - 32px)); box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: #fff; color: var(--ink); border: var(--outline); border-radius: 14px; box-shadow: var(--pop); }
.chat-box[hidden] { display: none; }
.chat-label { font: 900 13px var(--body); text-transform: uppercase; letter-spacing: 0.06em; }
.chat-box input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font: 700 15px var(--body); padding: 4px 0; }
.chat-hint { font: 700 11px var(--body); opacity: 0.6; white-space: nowrap; }
@media (max-width: 560px) { .chat-hint { display: none; } }
.tag span {
  display: inline-block; padding: 1px 9px; border-radius: 99px; color: #fff; font: 13px/1.45 var(--display); letter-spacing: 0.03em;
  background: color-mix(in srgb, var(--c) 72%, #2a1b12); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.float {
  color: #fff; font: 20px var(--display); letter-spacing: 0.02em;
  text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 4px 0 var(--ink);
}
.float.money { color: #a8f07a; }
.float.star { color: var(--yellow); font-size: 24px; }
.float.heart { color: var(--pink); }
.float.note { color: #ffd27a; font-size: 20px; opacity: 0.85; }

/* ---------------------------------------------------------- HUD */
#hud { --hud-paper: rgba(255, 248, 234, 0.95); --hud-gap: 12px; --hud-width: 240px; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
#hud kbd { border: 0; box-shadow: none; background: rgba(42, 27, 18, 0.09); border-radius: 4px; height: 1.65em; min-width: 1.65em; transform: none; }
#hud .btn { border: 0; box-shadow: none; border-radius: 7px; font: 800 13px/1.3 var(--body); letter-spacing: 0; padding: 8px 10px; }
#hud .btn:hover { transform: none; filter: brightness(1.08); }
#hud .btn:active { transform: translateY(1px); }
#hud .btn:disabled { box-shadow: none; }
#hud button:focus-visible, #hud summary:focus-visible, .rail:focus-visible { outline: 2px solid var(--blue-d); outline-offset: 3px; }
.hud-left { position: absolute; left: var(--hud-gap); top: var(--hud-gap); bottom: var(--hud-gap); width: var(--hud-width); display: flex; flex-direction: column; gap: 10px; pointer-events: none !important; }
.hud-left > * { pointer-events: auto; }
.hud-tl, .hud-tr { background: var(--hud-paper); border-radius: 10px; padding: 11px 13px; }
.hud-tl { position: relative; flex: none; }
.smoke-boost { position: absolute; left: calc(100% + 8px); top: 4px; width: 32px; height: 32px; color: var(--cream); filter: drop-shadow(0 1px 2px #211b18); cursor: help; }
.smoke-boost svg { width: 100%; height: 100%; display: block; }
.smoke-boost:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; border-radius: 4px; }
.hud-tl .day { display: flex; gap: 8px; align-items: center; font: 800 12px var(--body); color: var(--ink-2); margin-top: 5px; }
.hud-tl .day .wk { color: var(--ink-3); }
.hud-tl .rname { font: 800 11px var(--body); letter-spacing: 0.03em; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud-tl .clock { font: 1.65rem/1.15 var(--display); margin-top: 2px; }
.hud-tl .phase { font: 700 11px var(--body); color: var(--ink-2); margin-top: 3px; }
.hud-tl .phase.open { color: #246936; }
.hud-tl .phase.closing-phase { color: #9b3028; }
.bar { position: relative; height: 4px; border-radius: 3px; background: #e4d6c0; margin: 9px 0 0; }
.bar > i { display: block; height: 100%; background: #b57a17; border-radius: inherit; }
.bar > b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--cream); color: #986413; display: grid; place-items: center; font-size: 11px; }
.bar > b.moon { color: var(--blue-d); }
.hud-tr { position: absolute; right: var(--hud-gap); top: var(--hud-gap); width: var(--hud-width); text-align: right; }
.hud-tr .cash { font: 1.8rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.hud-tr .cash.neg { color: #ad3227; }
.hud-tr .cash.bump { animation: bump 0.35s ease-out; }
@keyframes bump { 30% { scale: 1.08; } }
.hud-tr .rating { font: 700 12px var(--body); color: var(--ink-2); margin-top: 4px; }
.hud-tr .stars { color: #946311; letter-spacing: 1px; font-size: 14px; }
.hud-tr .lvl { font: 800 11px var(--body); color: var(--ink-2); margin-top: 8px; }
.hud-tr .bar { margin-top: 5px; }
.hud-tr .bar > i { background: #4f83b7; }
.hud-tr .story-goal { margin-top: 9px; font-size: 11px; line-height: 1.4; color: var(--ink-2); }
.hud-tr .story-goal b { display: block; color: var(--ink); margin-bottom: 2px; }
.hud-tr .story-goal .goal-done { color: #246936; }

.hud-bl { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none !important; }
.hud-bl > * { pointer-events: auto; }
.rail { position: relative; flex: 1; width: 100%; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #a98b6b transparent; padding: 2px 4px 4px 0; }
.rail:empty { pointer-events: none; }
.ticket { flex: none; width: 100%; background: #fffaf0; border-radius: 8px; border: 0; border-left: 3px solid #6b9b70; font: 700 12px/1.3 var(--body); padding: 0 10px 8px; position: relative; }
.ticket header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 -10px 5px; padding: 6px 10px; background: #e7f0e3; border-radius: 0 8px 0 0; }
.ticket.mid { border-color: #b78a28; }
.ticket.mid header { background: #f6e9be; }
.ticket.late { border-color: #b64b3d; }
.ticket.late header { background: #f6d9cf; }
.ticket.eating { opacity: 0.85; }
.ticket header .num { font: 800 12px var(--body); }
.ticket header .tm { font: 700 12px var(--mono); font-variant-numeric: tabular-nums; }
.ticket.late header .tm { color: #9b3028; }
.ticket .ln { display: flex; gap: 4px; align-items: baseline; cursor: help; padding: 2px 0 1px; font-weight: 900; }
.ticket .ln.done { text-decoration: line-through; color: var(--ink-3); cursor: default; }
.ticket .ln .x { margin-left: auto; flex: none; border: 0; background: none; color: #a65346; font-weight: 900; padding: 0 3px; cursor: pointer; }
.ticket .ln .x:hover { color: #a3241b; background: #f6d9cf; border-radius: 4px; }
.ticket .drk { color: var(--blue-d); }
.ticket .drk::before { content: '🥤'; font-size: 11px; margin-right: 2px; }
.ticket .crit { display: inline-block; margin-top: 4px; font: 800 10px var(--body); color: #805719; letter-spacing: 0.06em; }
.ticket .comps { font: 700 11px/1.35 var(--body); color: var(--ink-2); margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 1px 5px; }
.ticket .comps i { display: inline-flex; align-items: center; gap: 3px; font-style: normal; }
.ticket .comps i s { display: inline-block; width: 7px; height: 7px; border-radius: 2px; border: 1px solid rgba(42,27,18,0.3); text-decoration: none; }

.prompt { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; align-items: center; max-width: calc(100% - 540px); width: max-content; pointer-events: none !important; }
.prompt .chip { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 7px; background: var(--hud-paper); font: 800 12px/1.35 var(--body); min-width: 0; overflow-wrap: anywhere; }
.prompt .chip kbd { flex: none; font-size: 12px; }
.prompt .chip.blocked { background: #4b3628; color: #fff3e3; font-weight: 700; }
.prompt .hand { background: #34251d; color: #fff; }
.prompt .hand small { color: #f5d49b; font: 800 10px var(--body); text-transform: uppercase; }
.need { position: absolute; left: 50%; bottom: 106px; transform: translateX(-50%); padding: 7px 12px; border-radius: 8px; background: #fff0c5; color: var(--ink); font: 700 12px/1.4 var(--body); pointer-events: none !important; max-width: min(650px, calc(100% - 540px)); text-align: center; }
.need b { color: #9b3028; }
.need .ok { color: #246936; font-weight: 900; }

.keys { flex: 0 1 auto; min-height: 0; padding: 10px 12px; font: 700 12px var(--body); color: var(--ink-2); display: grid; gap: 5px; width: 100%; max-height: 42vh; overflow: auto; background: var(--hud-paper); border-radius: 9px; }
.keys span { display: flex; align-items: center; gap: 6px; }
.keys-toggle { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 0; border-radius: 6px; background: var(--hud-paper); font: 800 12px var(--body); }
.hud-br { position: absolute; right: var(--hud-gap); bottom: var(--hud-gap); padding: 7px 10px; font: 700 11px/1.4 var(--body); display: flex; flex-direction: column; gap: 2px; align-items: flex-end; max-width: var(--hud-width); background: var(--hud-paper); border-radius: 8px; text-align: right; }
.hud-br .code { font: 1.4rem/1.1 var(--display); letter-spacing: 0.15em; color: var(--ink); }
.hud-br .hint-line { font-size: 11px; color: var(--ink-2); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; }
.dot.on { background: var(--green-d); }
.dot.off { background: var(--red-d); }

.morning { flex: none; background: var(--hud-paper); border-radius: 9px; padding: 10px; max-height: 38vh; overflow: auto; }
.morning .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.morning .row .btn { flex: 1 1 auto; }
.morning .partner { flex-basis: 100%; font: 700 11px var(--body); color: var(--ink-2); }
.morning ul { margin: 7px 0 2px; padding-left: 16px; color: var(--ink-2); font-size: 12px; }
.morning li { margin: 4px 0; }
.morning li.warn { color: #9b3028; font-weight: 800; }
.morning .prep-alerts { margin: 0 0 9px; }
.prep-notes { font: 700 11px var(--body); margin-top: 8px; color: var(--ink-2); }
.prep-notes summary { cursor: pointer; width: fit-content; }
.hud-toggle { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 7px; background: var(--hud-paper); border: 0; font: 800 11px var(--body); color: var(--ink-2); }
.hud-toggle:hover { background: #fffaf0; color: var(--ink); }
.hud-toggle:active { transform: translateX(-50%) translateY(1px); }
.hud-toggle kbd { font-size: 10px; }
.hud-toggle .eye { width: 13px; height: 9px; border: 1.5px solid currentColor; border-radius: 50% / 60%; position: relative; }
.hud-toggle .eye::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; background: currentColor; border-radius: 50%; transform: translate(-50%, -50%); }
#hud.hud-min .hud-toggle .eye::before { content: ''; position: absolute; left: -3px; right: -3px; top: 50%; height: 1.5px; background: currentColor; transform: rotate(-30deg); }
#hud.hud-min .hud-tl, #hud.hud-min .hud-tr, #hud.hud-min .hud-br, #hud.hud-min .hud-bl { display: none !important; }
#hud.hud-min .morning { margin-top: auto; margin-bottom: 56px; }
#hud.hud-min .prep-alerts, #hud.hud-min .prep-notes, #hud.hud-min .morning .partner { display: none; }
.closing { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); max-width: calc(100% - 540px); text-align: center; padding: 7px 12px; border-radius: 7px; font: 800 12px var(--body); background: #f7e2cd; color: var(--ink); }
@media (max-width: 1100px), (max-height: 760px) {
  #hud { --hud-gap: 10px; --hud-width: 210px; }
  .hud-left { gap: 8px; }
  .hud-tl, .hud-tr { padding: 9px 11px; }
  .hud-tl .clock { font-size: 1.45rem; }
  .hud-tr .cash { font-size: 1.6rem; }
  .morning { padding: 8px; }
  #hud .morning .btn { padding: 7px; font-size: 12px; }
  .prompt, .need, .closing { max-width: calc(100% - 470px); }
}
@media (max-width: 700px) {
  #hud { --hud-width: 180px; --hud-gap: 8px; }
  .hud-left, .hud-tr { top: 48px; }

}

#toasts { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 7px; align-items: center; z-index: 30; pointer-events: none; }
.toast { padding: 8px 16px; border-radius: 14px; background: #fff; color: var(--ink); border: var(--outline); box-shadow: var(--pop); font: 900 14.5px var(--body); animation: toastIn 0.3s cubic-bezier(.3,1.6,.6,1); max-width: 70vw; text-align: center; }

.toast.out { opacity: 0; translate: 0 -6px; transition: opacity 0.4s, translate 0.4s; }

/* ---------------------------------------------------------- big moments */
.banner { position: absolute; left: 50%; top: 34%; z-index: 44; transform: translate(-50%, -50%); text-align: center; pointer-events: none; animation: bannerIn 0.5s cubic-bezier(.3,1.6,.5,1); }
.banner .t {
  display: inline-block; padding: 10px 34px 8px; font: clamp(2.4rem, 6vw, 4.4rem)/1 var(--display); color: #fff; letter-spacing: 0.03em;
  background: var(--bc, var(--red)); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 7px 0 var(--ink), 0 20px 40px rgba(0,0,0,0.35);
  text-shadow: 0 4px 0 rgba(0,0,0,0.25); rotate: -2deg;
}
.banner .s { display: inline-block; margin-top: 12px; padding: 5px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; font: 900 1rem var(--body); box-shadow: var(--pop); }

@keyframes bannerOut { to { scale: 1.3; opacity: 0; } }
.coin { position: absolute; z-index: 46; width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); border: 2.5px solid var(--ink); box-shadow: inset 0 -3px 0 var(--yellow-d); pointer-events: none; display: grid; place-items: center; font: 12px var(--display); }

/* ---------------------------------------------------------- modals (pickers, cookbook, pause) */
#modal { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; background: rgba(28, 16, 8, 0.45); }
#modal.light { background: transparent; pointer-events: none; place-items: end center; padding-bottom: 86px; }
#modal.light > .sheet { max-height: 52vh; }
#modal.light > .sheet { pointer-events: auto; }
.sheet { width: min(var(--menu-width), 100%); min-width: 0; background: var(--cream); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 44px rgba(20,10,4,0.3); padding: 20px; max-height: calc(100dvh - 40px); overflow: auto; overscroll-behavior: contain; overflow-wrap: anywhere; position: relative; animation: pop 0.25s cubic-bezier(.3,1.5,.6,1); }
.sheet.sheet-refresh { animation: none; }

.picker { padding: 16px; }
.picker h2 { font-size: 1.45rem; }

.picker .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 10px 8px; }
.pick { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 11px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; text-align: left; position: relative; transition: background 0.12s; }
.pick:hover, .pick:focus-visible { background: var(--cream-2); outline: 2px solid var(--ink-3); outline-offset: 1px; }
.pick:active { background: var(--cream-3); }

.pick.wanted { background: #e2f8dc; }

.empty { color: var(--ink-3); padding: 18px; text-align: center; font-weight: 800; }

.sheet.cookbook { width: min(1000px, 100%); }
.cookbook .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 12px; }
.recipe { min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }

@media (max-width: 480px) {

}
.section-title { font: 0.95rem var(--display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin: 16px 0 8px; }

/* ---------------------------------------------------------- office */
#office { position: absolute; inset: 0; z-index: 20; background: rgba(28, 16, 8, 0.6); display: flex; padding: 20px; }

.office { margin: auto; width: min(1200px, 100%); height: min(800px, 100%); min-width: 0; background: var(--cream); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.office-head { display: flex; align-items: center; gap: 12px 20px; padding: 16px 20px; flex-wrap: wrap; background: var(--wood); color: #fff; }

.cols2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; }
.cols2 > * { min-width: 0; }
@media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }
.card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h3 { margin: 0 0 8px; font: 1.3rem var(--display); letter-spacing: 0.01em; }
.receipt { background: #fffef9; font-family: var(--mono); position: relative; padding-bottom: 22px; border-radius: 6px 6px 0 0; }
.receipt::after { content: ''; position: absolute; left: -3px; right: -3px; bottom: -14px; height: 16px; background: linear-gradient(-45deg, transparent 8px, #fffef9 8px) 0 0 / 16px 16px repeat-x, linear-gradient(45deg, transparent 8px, #fffef9 8px) 0 0 / 16px 16px repeat-x; }
.receipt h3 { font-family: var(--display); text-align: center; border-bottom: 2px dashed var(--ink); padding-bottom: 8px; }
.pl { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
.pl td { padding: 3px 0; }

.pl tr.total td { border-top: 2px solid var(--ink); font-weight: 900; padding-top: 5px; }
.pl tr.net td { font: 1.35rem var(--display); border-top: 4px double var(--ink); padding-top: 6px; }
.pos { color: var(--green-d); }
.neg { color: var(--red); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.kpi { min-width: 0; background: #fff; border-radius: 10px; padding: 10px 12px; }

.kpi b { display: block; font: 1.6rem var(--display); }

.reviews { display: flex; flex-direction: column; gap: 7px; max-height: 250px; overflow: auto; }
.review { font-size: 0.9rem; padding: 9px 11px; border-radius: 8px; background: var(--cream-2); font-weight: 700; }
.review .st { color: var(--yellow); letter-spacing: 1px; -webkit-text-stroke: 1px var(--ink); font-size: 1.05rem; }
.review .who { color: var(--ink-3); font-size: 0.8rem; }

.spark { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 8px; border-bottom: 3px solid var(--ink); }

.me { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.me th { text-align: left; font: 0.78rem var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); padding: 5px; border-bottom: 2px solid var(--ink); }
.me td { padding: 6px 5px; border-bottom: 2px dotted var(--line); font-weight: 800; }
.me td.n { text-align: right; font-family: var(--mono); font-weight: 700; }
.cls { display: inline-block; padding: 1px 8px; border-radius: 8px; font: 0.8rem var(--display); letter-spacing: 0.03em; color: #fff; border: 2px solid var(--ink); }
.cls.Star { background: var(--yellow-d); }
.cls.Plowhorse { background: #6a7a8a; }

.tip { font-size: 0.84rem; color: var(--ink-3); font-weight: 700; }

.menu-list { display: flex; flex-direction: column; gap: 1px; overflow: hidden; border-radius: 10px; background: var(--line); }

.mrow .nm { min-width: 0; font-weight: 900; }
.mrow .nm small { display: block; margin-top: 3px; font-weight: 700; color: var(--ink-2); font-size: 0.78rem; line-height: 1.4; }
.mrow .n { font-family: var(--mono); font-size: 0.86rem; text-align: right; font-weight: 700; }
.price { display: flex; align-items: center; justify-content: center; gap: 4px; }
.price input { width: 66px; height: 32px; min-width: 0; text-align: center; border: 1px solid #a88d73; border-radius: 6px; padding: 4px 2px; background: #fff; font: 700 14px var(--mono); appearance: textfield; }
.price input::-webkit-inner-spin-button, .price input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.price button { display: grid; place-items: center; flex: 0 0 28px; padding: 0; border: 1px solid #b98b22; background: var(--yellow); border-radius: 6px; width: 28px; height: 32px; font: 18px/1 var(--display); }
.price button:active { background: var(--yellow-d); }
.toggle { display: block; width: 44px; height: 28px; border-radius: 99px; background: #dbc6a9; border: 2px solid var(--ink-2); position: relative; padding: 0; justify-self: center; }
.toggle::after { content: ''; box-sizing: border-box; position: absolute; left: 3px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--ink-2); transition: left 0.15s; }
.toggle.on { background: var(--green); }

.office button:focus-visible, .office input:focus-visible, .office select:focus-visible, .layout-bar button:focus-visible { outline: 3px solid var(--blue-d); outline-offset: 3px; }
.fc { font-size: 0.78rem; }
.fc.hi { color: var(--red); font-weight: 900; }
.appeal { color: var(--yellow); font-size: 0.85rem; letter-spacing: -1px; -webkit-text-stroke: 1px var(--ink); }
.mhead { display: grid; grid-template-columns: 44px minmax(0, 1fr) 136px 76px 74px 55px; gap: 12px; align-items: center; font: 0.74rem var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); padding: 0 12px; }
.mhead > :first-child, .mhead > :nth-child(3) { text-align: center; }
.mhead > :nth-child(4), .mhead > :nth-child(5) { text-align: right; }

.builder .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 9px; }
.builder input[type=text], .builder select { border: var(--outline); border-radius: 10px; padding: 6px 9px; background: #fff; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip2 { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; background: var(--cream-2); border: 2px solid var(--ink); font-size: 0.88rem; font-weight: 800; }
.chip2 button { border: 0; background: none; color: var(--red); font-weight: 900; padding: 0; }
.chip2 .sw { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--ink); }
.preview { display: flex; gap: 14px; font-size: 0.92rem; margin: 9px 0; flex-wrap: wrap; font-weight: 800; }
.preview b { font-family: var(--mono); }

.supplier-summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.supplier-order { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.table-scroll { max-width: 100%; margin-top: 12px; }
@media (max-width: 900px) {
  .table-scroll { max-height: min(420px, 52vh); overflow: auto; }

}
.sup { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.sup th { text-align: left; font: 0.78rem var(--display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); padding: 6px 5px; border-bottom: 2px solid var(--ink); position: sticky; top: 0; background: var(--cream); z-index: 1; }

.sup .exp { color: var(--red); font-size: 0.78rem; }
.sup .short { color: var(--red); font-weight: 900; }

.ups { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(255px, 100%), 1fr)); gap: 12px; }
.up { min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
.up h4 { margin: 0; font: 1.15rem var(--display); display: flex; justify-content: space-between; gap: 6px; letter-spacing: 0.01em; }
.up h4 span { color: var(--green-d); white-space: nowrap; }
.up p { margin: 0; color: var(--ink-2); font-size: 0.88rem; flex: 1; font-weight: 700; }

.layout-bar { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); pointer-events: auto; padding: 10px 14px; display: flex; gap: 12px; align-items: center; z-index: 25; width: min(680px, calc(100vw - 24px)); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 24px rgba(28,16,8,0.18); }

@media (max-width: 1000px) {

import * as THREE from 'three';
const __m = {};

// ---- src/config.js ----
__m.config = (() => {
// Every tuning number in one place. Times are real seconds unless noted.

const BUILD = 'tf-1.4.0-four';
const APP_ID = 'two-forks-bistro-game-2026';
const MAX_PLAYERS = 4;   // host plus up to three friends

const CFG = {
  tickHz: 30,
  slowHz: 8,     // full game-state snapshots to each joined chef
  fastHz: 20,    // positions only

  // A service covers 11:00 to 22:00 (660 game minutes) in 10 real minutes.
  serviceStart: 11 * 60,

  move: { speed: 4.6, accel: 30, radius: 0.32, reach: 1.25 },

  cookTimeMultiplier: 0.9,
  burn: { grill: 30, pan: 20, fryer: 15, oven: 40, pot: 0 },
  potOvercook: 60,
  overdoneQuality: 0.75,
  coldAfter: 75,
  coldAfterLamp: 150,
  chopSpeedKnife: 1.6,

  work: { order: 2.0, pay: 1.5, wash: 1.8, unpack: 0.9 },

  party: {

    drain: 0.55,             // mood per second once patience runs out
    queueDrain: 0.45,
    queuePatience: 90,
    browse: [14, 24],
    orderPatience: 60,
    drinkPatience: 75,
    foodGrace: 80,           // plus 25 s per dish before waiting for food hurts
    gracePerDish: 25,
    eat: [50, 70],
    dessertEat: [28, 38],
    payPatience: 50,
    walkSpeed: 2.6,
    radius: 0.34,
    seatingTimeout: 20,
  },

  traffic: {
    perTable: 2.8,
    capPerTable: 2.7,
    crew: [0.6, 1, 1.25, 1.45],      // guest volume for 1, 2, 3 and 4 chefs
    minGap: [34, 16, 13, 11],        // game minutes between arrivals at least, by chef count
    weekday: [0.8, 0.85, 0.95, 1.0, 1.25, 1.3, 1.1], // Mon..Sun
    // Relative arrivals per game hour from 11:00 to 21:00.
    hourly: [1, 3, 2, 1, 0.4, 0.7, 1, 2, 2.2, 1.2, 0.3],
  },

  money: {
    startCash: 1500,
    rent: 120,
    loan: 40,
    utilities: 30,
    utilityPerStation: 3,
    cardFee: 0.03,
    suppliesPerGuest: 0.6,
    cleaningPerPlate: 2,
    rushMarkup: 1.4,
    rushDelay: 30,
  },

  rep: {
    window: 40,

// ---- src/data/layout.js ----
__m.data_layout = (() => {
// The starting restaurant, as a tile map (1 tile = 1 m). North (z = 0) is the
// back wall; the camera looks north from the dining room side.
//
//  #  wall          B  back door      D  front door (walkable)
//  F  fridge        Z  freezer        P  pantry
//  c  counter       b  cutting board  g  grill     p  stove (pan)
//  o  pot           f  fryer          v  oven      w  prep well
//  r  plate rack    s  sink           x  bin       k  pass
//  d  drink station h  host stand     l  delivery pallet

const MAP = [
  '####################',
  '#FZPcbbcggppoofvcsx#',
  '#..................#',
  'B....wwwwcccr......#',
  '#l.................#',
  '####kkkkkk..d#######',
  '#..................#',
  '#..................#',
  '#..................#',
  '#..................#',
  '#..................#',
  '#..................#',
  '#..................#',
  '#...h..............#',
  '##D#################',
];

const KITCHEN_MAX_Z = 4; // rows 1..4 are kitchen floor; 6..13 dining
const LAYOUT_MIN_Z = 1;

const CHAR_TYPES = {
  F: 'fridge', Z: 'freezer', P: 'pantry', c: 'counter', b: 'board', g: 'grill', p: 'pan', o: 'pot',
  f: 'fryer', v: 'oven', w: 'well', r: 'rack', s: 'sink', x: 'bin', k: 'pass', d: 'drinks', h: 'host', l: 'dock',
};

// Tables include their chairs in the footprint. A 2-top is 3 wide (chair,
// table, chair); a 4-top is 2 wide and 3 deep (chairs, table, chairs).
const DEFAULT_TABLES = [
  { seats: 4, x: 5, z: 7 },
  { seats: 4, x: 9, z: 7 },
  { seats: 4, x: 13, z: 7 },
  { seats: 2, x: 6, z: 11 },
  { seats: 2, x: 11, z: 11 },
  { seats: 2, x: 15, z: 11 },
];

// Each cuisine starts with the same useful equipment and seat count, but the
// floor plan is different. Station rows are [start x, z, map characters].
// Storage stays by deliveries. Cooking lines face a clear back aisle; prep
// benches face the service aisle. The pass separates kitchen and dining.
const STARTING_LAYOUTS = {
  southern: {
    stations: [[1, 1, 'FZPcbbcggppoofvcsx'], [5, 3, 'wwwwcccr'], [1, 4, 'l'], [4, 5, 'kkkkkk'], [12, 5, 'd'], [4, 13, 'h']],
    tables: DEFAULT_TABLES,
  },
  italian: {
    // Dough prep beside the oven; pasta equipment and a separate plating bench.
    stations: [[1, 1, 'FZPccbbvooppggfcsx'], [6, 3, 'rccwwwwc'], [1, 4, 'l'], [4, 5, 'kkkkkk'], [12, 5, 'd'], [4, 13, 'h']],
    tables: [{ seats: 4, x: 3, z: 7 }, { seats: 4, x: 8, z: 7 }, { seats: 4, x: 13, z: 7 }, { seats: 2, x: 5, z: 11 }, { seats: 2, x: 10, z: 11 }, { seats: 2, x: 15, z: 11 }],
  },
  mexican: {
    // One prep and filling bench opposite the grill and rice/bean cooking line.
    stations: [[1, 1, 'FZPcccggppoofvccsx'], [4, 3, 'bbwwwwcr'], [1, 4, 'l'], [4, 5, 'kkkkkk'], [12, 5, 'd'], [3, 13, 'h']],
    tables: [{ seats: 4, x: 3, z: 7 }, { seats: 4, x: 8, z: 8 }, { seats: 4, x: 13, z: 7 }, { seats: 2, x: 4, z: 12 }, { seats: 2, x: 11, z: 12 }, { seats: 2, x: 16, z: 11 }],
  },
  diner: {
    // Two short work benches leave a wide central route to the griddle line.
    stations: [[1, 1, 'FZPcccggppfvoo'], [17, 1, 'sx'], [3, 3, 'bcwwc'], [12, 3, 'rwwbc'], [1, 4, 'l'], [4, 5, 'kkkkkk'], [12, 5, 'd'], [3, 13, 'h']],
    tables: [{ seats: 4, x: 5, z: 7 }, { seats: 4, x: 5, z: 11 }, { seats: 4, x: 10, z: 8 }, { seats: 2, x: 14, z: 7 }, { seats: 2, x: 14, z: 9 }, { seats: 2, x: 14, z: 11 }],
  },
  noodle: {
    // Broth and noodle pots face the topping bench and bowl assembly counter.
    stations: [[1, 1, 'FZPccccooppggfvsx'], [5, 3, 'bbwwwwcrc'], [1, 4, 'l'], [4, 5, 'kkkkkk'], [12, 5, 'd'], [8, 13, 'h']],
    tables: [{ seats: 4, x: 4, z: 7 }, { seats: 4, x: 8, z: 8 }, { seats: 4, x: 12, z: 7 }, { seats: 2, x: 4, z: 12 }, { seats: 2, x: 10, z: 12 }, { seats: 2, x: 15, z: 11 }],
  },
};

function startingObjects(cuisine) {
  const plan = STARTING_LAYOUTS[cuisine] || STARTING_LAYOUTS.southern;
  const objects = [];
  for (const [startX, z, cells] of plan.stations) {
    [...cells].forEach((char, dx) => objects.push({ type: CHAR_TYPES[char], x: startX + dx, z }));
  }
  for (const table of plan.tables) objects.push({ type: 'table', ...table });
  return objects;
}

const TABLE_SIZE = { 2: { w: 3, h: 1 }, 4: { w: 2, h: 3 } };

const FRONT_DOOR = { x: 2, z: 14 };
const QUEUE_SPOTS = [
  { x: 2.5, z: 12.9 }, { x: 1.6, z: 12.9 }, { x: 1.6, z: 12.0 }, { x: 2.5, z: 12.0 },
  { x: 1.6, z: 11.1 }, { x: 2.5, z: 11.1 }, { x: 1.6, z: 10.2 }, { x: 2.5, z: 10.2 },
];
const SPAWN_POINTS = [{ x: 10.5, z: 4.5 }, { x: 11.5, z: 4.5 }, { x: 9.5, z: 4.5 }, { x: 12.5, z: 4.5 }];

const STORY_BUILDING = { width: 14, height: 12, divider: { from: 4, to: 10 } };
const FLOOR_EXPANSION_WIDTH = 10;

/** Saved dimensions keep furniture coordinates stable when the room grows. */
function roomSize(state) {
  const building = state.mode === 'story' && state.building;
  return building ? { width: building.width, height: building.height } : { width: MAP[0].length, height: MAP.length };
}

function frontDoor(state) { return { x: FRONT_DOOR.x, z: roomSize(state).height - 1 }; }

function spawnPoints(state) {
  return state.mode === 'story' && state.building?.height === STORY_BUILDING.height
    ? [{ x: 9.5, z: 4.5 }, { x: 10.5, z: 4.5 }, { x: 8.5, z: 4.5 }, { x: 11.5, z: 4.5 }]
    : SPAWN_POINTS;
}

function queueSpots(state) {
  const offset = roomSize(state).height - MAP.length;
  return QUEUE_SPOTS.map((spot) => ({ x: spot.x, z: spot.z + offset }));
}

function layoutTile(state, x, z) {
  const { width, height } = roomSize(state);

const STORES = {
  fridge: { name: 'Walk-in fridge' },
  freezer: { name: 'Freezer' },
  pantry: { name: 'Pantry' },
};

/** Look and label for an ingredient in a given state. */
function stateInfo(ingId, st) {
  const d = ING[ingId];
  if (!d) return { label: ingId, shape: 'box', color: 0x999999 };
  if (st === 'burnt') return { label: `Burnt ${d.name.toLowerCase()}`, shape: d.look.shape, color: 0x2a221e };
  if (st === 'raw') return d.look;
  const s = d.steps.find((x) => x.to === st);
  return s ? { label: s.label, shape: s.shape, color: s.color } : d.look;
}

/** The step this station can do to an ingredient in its current state, if any. */
function stepFor(ingId, st, station) {
  const d = ING[ingId];
  if (!d) return null;
  return d.steps.find((s) => s.from === st && s.at === station) || null;
}

/** Seconds of station time to take an ingredient from raw to a target state. */
function chainTime(ingId, target) {
  const d = ING[ingId];
  if (!d || target === 'raw') return 0;
  let t = 0, cur = target, guard = 0;
  while (cur !== 'raw' && guard++ < 6) {
    const s = d.steps.find((x) => x.to === cur);
    if (!s) break;
    t += s.t;
    cur = s.from;
  }
  return t;
}

/** Every state an ingredient can reach (including raw). */
function statesOf(ingId) {
  const d = ING[ingId];
  return ['raw', ...d.steps.map((s) => s.to)];
}

return { ING, STORES, stateInfo, stepFor, chainTime, statesOf };

function plateFull(plate) { return plate.items.length >= PLATE_MAX; }

function addToPlate(plate, it) {
  const one = cloneItem(it);
  delete one.n;
  plate.items.push(one);
}

function waste(ctx, it, why = 'binned') {
  const c = itemCost(it);
  if (c > 0) ctx.state.today.waste[why] = round2(ctx.state.today.waste[why] + c);
  if (it && it.k === 'ing' && it.st === 'burnt') ctx.state.today.burnt++;
  if (it && it.k === 'plate') for (const x of it.items) if (x.st === 'burnt') ctx.state.today.burnt++;
  addTrash(ctx.state, trashUnits(it));
}

function trashUnits(it) {
  if (!it) return 0;
  if (it.k === 'ing') return it.n || 1;
  if (it.k === 'plate') return it.items.reduce((n, item) => n + trashUnits(item), 0);
  if (it.k === 'drink' || it.k === 'box') return 1;
  return 0;
}

function changeArea(ctx, p) {
  const area = playerArea(p) === 'alley' ? 'restaurant' : 'alley';
  let spawn = ALLEY_SPAWN;
  if (area === 'restaurant') {
    const grid = ctx.grid;
    let best = null, distance = Infinity;
    // Old saves can have furniture in front of the back door.
    for (let z = 1; z < grid.height - 1; z++) for (let x = 1; x < grid.width - 1; x++) {
      if (!walkable(grid, x, z)) continue;
      const d = (x - BACK_DOOR.x - 1) ** 2 + (z - BACK_DOOR.z) ** 2;
      if (d < distance) { distance = d; best = { x: x + 0.5, z: z + 0.5, rot: Math.PI / 2 }; }
    }
    if (!best) return null;
    spawn = best;
  }
  Object.assign(p, spawn, { area, areaRev: (p.areaRev || 0) + 1, space: false, working: null });
  ctx.emit({ type: 'areaChanged', to: p.id, area, areaRev: p.areaRev });
  return 'ok';
}

function sfx(ctx, name, o) { ctx.emit({ type: 'sfx', name, x: o ? o.x + 0.5 : undefined, z: o ? o.z + 0.5 : undefined }); }

/** Combine what is in hand with what is on a surface. Returns a label or null. */
function combine(ctx, p, surfaceItem, setSurface, dry) {
  const h = p.hand;
  const s = surfaceItem;
  // Plate in hand, food on the surface: put the food on the plate.
  if (h.k === 'plate' && s.k === 'ing') {
    if (s.st === 'raw' && ING[s.ing].steps.length && !isContainer(s)) {
      // Raw food that still needs cooking can still be plated (cheese, raw egg),
      // but only things that are eaten raw make sense; allow it and let the
      // dish matcher decide.
    }
    if (plateFull(h)) return dry ? { blocked: 'Plate is full' } : null;
    if (dry) return `Plate ${lc(ingName(s))}`;
    const { one, left } = takePortion(s);
    addToPlate(h, one);
    h.platedBy = p.id;
    setSurface(left);
    sfx(ctx, 'plate');
    return 'ok';
  }
  // Food in hand, plate on the surface.
  if (h.k === 'ing' && s.k === 'plate') {
    if (plateFull(s)) return dry ? { blocked: 'Plate is full' } : null;
    if (dry) return `Add ${lc(ingName(h))} to plate`;
    addToPlate(s, h);
    s.platedBy = p.id;
    p.hand = null;
    sfx(ctx, 'plate');
    return 'ok';
  }
  // Topping onto raw pizza dough (either way round).
  if (h.k === 'ing' && canTop(s) && toppable(h)) {
    if (dry) return `Top the dough with ${lc(ingName(h))}`;
    s.top = s.top || [];
    s.top.push({ ing: h.ing, st: h.st, cost: h.cost });
    p.hand = null;
    sfx(ctx, 'plate');
    return 'ok';
  }
  if (canTop(h) && s.k === 'ing' && toppable(s)) {
    if (dry) return `Top the dough with ${lc(ingName(s))}`;
    const { one, left } = takePortion(s);
    h.top = h.top || [];
    h.top.push({ ing: one.ing, st: one.st, cost: one.cost });
    setSurface(left);
    sfx(ctx, 'plate');
    return 'ok';
  }
  // A finished pizza goes onto a plate.
  if (h.k === 'plate' && isContainer(s) && s.st !== 'raw') {
    if (plateFull(h)) return dry ? { blocked: 'Plate is full' } : null;
    if (dry) return `Plate ${lc(itemLabel(ctx.state, s))}`;
    addToPlate(h, s);
    h.platedBy = p.id;
    setSurface(null);
    sfx(ctx, 'plate');
    return 'ok';
  }
  return null;
}

function giveTo(ctx, p, it) {
  const h = p.hand;
  if (!h) { p.hand = it; return true; }
  if (h.k === 'plate' && !plateFull(h)) { addToPlate(h, it); h.platedBy = p.id; return true; }
  if (canTop(h) && toppable(it)) { h.top = h.top || []; h.top.push({ ing: it.ing, st: it.st, cost: it.cost }); return true; }
  return false;
}

function canReceive(p) {
  const h = p.hand;
  return !h || (h.k === 'plate' && !plateFull(h)) || canTop(h);
}

// ------------------------------------------------------------------ E

function actE(ctx, pid, dry, target) {
  const S = ctx.state;
  const p = S.players[pid];
  if (!p) return null;
  const o = target !== undefined ? target : findTarget(S, ctx.grid, p);
  if (p.smoking && (!o || o.type === 'smoking')) {
    if (dry) return 'Put out cigarette';
    p.smoking = null;
    return 'ok';
  }
  if (!o) {
    return null;
  }
  const h = p.hand;
  const t = o.type;
  const area = playerArea(p);
  if (!areaObjects(S, area).some((item) => item.id === o.id)) return null;

  if (t === 'backdoor') {
    if (area === 'restaurant' && followingParty(S, pid)) return dry ? { blocked: 'Seat your guests first' } : null;
    if (dry) return area === 'alley' ? 'Enter restaurant' : 'Go outside';
    return changeArea(ctx, p);
  }
  if (area === 'alley') {
    if (t === 'dumpster') {
      if (h?.k !== 'trash') return dry ? { blocked: h ? 'Only trash bags go here' : 'No trash bag'} : null;
      if (dry) return 'Dispose of trash bag';
      p.hand = null;
      ctx.emit({ type: 'sfx', name: 'bin', x: o.x + 0.5, z: o.z + 0.5, area: 'alley' });
      return 'ok';
    }
    if (t === 'smoking') {
      if (h) return dry ? { blocked: 'Put down what you are carrying' } : null;
      if (dry) return 'Smoke';
      p.smoking = { left: SMOKE_SECONDS, x: p.x, z: p.z };
      p.smokeBoostUntil = (S.t || 0) + SMOKE_BOOST_SECONDS;
      p.space = false;
      return 'ok';
    }
    return null;
  }
  if (h?.k === 'trash' && t !== 'bin') return dry ? { blocked: 'Take the trash bag to the alley dumpster' } : null;

  if (STORE_TYPES.has(t)) {
    if (h && h.k === 'box') {
      const d = ING[h.ing];
      if (d.store !== t) return dry ? { blocked: `That case goes in the ${name(d.store).toLowerCase()}` } : null;
      if (dry) return `Unpack ${d.case} × ${d.name.toLowerCase()}`;
      addLot(S, h.ing, d.case, d.cost);
      addTrash(S, 1);
      p.hand = null;
      sfx(ctx, 'unpack', o);
      ctx.emit({ type: 'float', text: `+${d.case} ${d.name.toLowerCase()}`, x: o.x + 0.5, z: o.z + 0.5, to: pid });
      return 'ok';
    }
    if (h && h.k === 'ing' && h.st === 'raw' && !h.top && ING[h.ing].store === t && !(h.n > 1)) {
      if (dry) return `Put ${lc(ING[h.ing].name)} back`;
      returnStock(S, h.ing, h.cost);
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (canReceive(p)) {
      if (dry) return `Open the ${name(t).toLowerCase()}`;
      ctx.emit({ type: 'picker', to: pid, store: t, obj: o.id });
      sfx(ctx, 'fridge', o);
      return 'ok';
    }
    return dry ? { blocked: 'Hands full' } : null;
  }

  if (t === 'counter' || t === 'pass') {
    if (!o.slot) {
      if (!h) return null;
      if (h.k === 'dirty') return dry ? { blocked: 'Dirty plates go to the sink' } : null;
      if (dry) return t === 'pass' ? `Put ${lc(itemLabel(S, h))} on the pass` : `Put down ${lc(itemLabel(S, h))}`;
      o.slot = h;
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (!h) {
      if (dry) return `Pick up ${lc(itemLabel(S, o.slot))}`;
      const { one, left } = o.slot.k === 'ing' ? takePortion(o.slot) : { one: o.slot, left: null };
      p.hand = one;
      o.slot = left;
      sfx(ctx, 'pick', o);
      return 'ok';
    }
    const r = combine(ctx, p, o.slot, (v) => { o.slot = v; }, dry);
    if (r) return r;
    return dry ? { blocked: `${name(t)} is full` } : null;
  }

  if (t === 'board') {
    if (!o.slot) {
      if (!h) return null;
      if (!stationAccepts('board', h)) return dry ? { blocked: h.k === 'ing' ? `Nothing to cut on ${lc(ingName(h))}` : 'Boards are for chopping' } : null;
      if (h.n > 1) return null;
      if (dry) return `Put ${lc(ingName(h))} on the board`;
      o.slot = h;
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (!h) {
      if (dry) return `Pick up ${lc(itemLabel(S, o.slot))}`;
      p.hand = o.slot;
      o.slot = null;
      sfx(ctx, 'pick', o);
      return 'ok';
    }
    const r = combine(ctx, p, o.slot, (v) => { o.slot = v; }, dry);
    if (r) return r;
    return dry ? { blocked: 'Board is busy' } : null;
  }

  if (HEAT_TYPES.has(t)) {
    if (!o.slot) {
      if (!h) return null;
      if (!stationAccepts(t, h)) {
        if (h.k !== 'ing') return dry ? { blocked: `Nothing to take from the ${name(t).toLowerCase()}` } : null;
        return dry ? { blocked: `Can't cook ${lc(ingName(h))} in the ${name(t).toLowerCase()}` } : null;
      }
      const step = stepFor(h.ing, h.st, t);
      if (dry) return `${t === 'pot' ? 'Boil' : t === 'oven' ? 'Bake' : t === 'fryer' ? 'Fry' : t === 'grill' ? 'Grill' : 'Cook'} → ${lc(step.label)}`;
      o.slot = h;
      o.slot.t = 0;
      o.slot.over = 0;
      p.hand = null;
      sfx(ctx, t === 'fryer' ? 'fry' : t === 'pot' ? 'pot' : 'sizzle', o);
      return 'ok';
    }
    const s = o.slot;
    if (!h) {
      const lbl = itemLabel(S, { ...s, n: 1 });
      if (dry) return `Take ${lc(lbl)}` + (s.st === 'raw' || stepFor(s.ing, s.st, t) ? ' (not done)' : '');
      const { one, left } = takePortion(s);
      p.hand = one;
      o.slot = left;
      sfx(ctx, 'pick', o);
      return 'ok';
    }
    // Add another identical portion to a pot or fryer basket.
    if (h.k === 'ing' && h.ing === s.ing && h.st === stepFrom(s, t) && !h.top && (s.n || 1) < stationCapacity(t) && s.t < 0.5 * (stepFor(s.ing, stepFrom(s, t), t) || { t: 0 }).t) {
      if (dry) return `Add another portion (${(s.n || 1) + 1}/${stationCapacity(t)})`;
      s.cost = (s.cost * (s.n || 1) + h.cost) / ((s.n || 1) + 1);
      s.n = (s.n || 1) + 1;
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (h.k === 'plate') {
      if (s.st === 'raw' || (stepFor(s.ing, s.st, t) && !isContainer(s))) return dry ? { blocked: 'Still cooking' } : null;
      return combine(ctx, p, s, (v) => { o.slot = v; }, dry);
    }
    return dry ? { blocked: `${name(t)} is busy` } : null;
  }

  if (t === 'well') {
    const w = o.well;
    if (!w) {
      if (!h || h.k !== 'ing' || h.top || h.st === 'burnt' || isContainer(h)) return h ? (dry ? { blocked: 'Wells hold prepped ingredients' } : null) : null;
      if (dry) return `Prep ${lc(ingName(h))} into the well`;
      o.well = { ing: h.ing, st: h.st, n: h.n || 1, cost: h.cost, day: S.day, hot: h.heat >= 0, q: h.q ?? 1 };
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (!h) {
      if (dry) return `Take ${lc(stateInfo(w.ing, w.st).label)} (${w.n} left)`;
      p.hand = wellPortion(o);
      sfx(ctx, 'pick', o);
      return 'ok';
    }
    if (h.k === 'ing' && h.ing === w.ing && h.st === w.st && !h.top) {
      const add = h.n || 1;
      if (w.n + add > CFG.wellMax) return dry ? { blocked: `Well is full (${CFG.wellMax})` } : null;
      if (dry) return `Add to well (${w.n + add}/${CFG.wellMax})`;
      w.cost = (w.cost * w.n + h.cost * add) / (w.n + add);
      w.n += add;
      w.day = Math.min(w.day, S.day);
      w.q = Math.min(w.q ?? 1, h.q ?? 1);
      p.hand = null;
      sfx(ctx, 'drop', o);
      return 'ok';
    }
    if (h.k === 'plate') {
      if (plateFull(h)) return dry ? { blocked: 'Plate is full' } : null;
      if (dry) return `Plate ${lc(stateInfo(w.ing, w.st).label)} (${w.n} left)`;
      addToPlate(h, wellPortion(o));
      h.platedBy = p.id;
      sfx(ctx, 'plate', o);
      return 'ok';
    }
    if (canTop(h) && toppable({ k: 'ing', ing: w.ing, st: w.st })) {
      if (dry) return `Top the dough with ${lc(stateInfo(w.ing, w.st).label)}`;
      const one = wellPortion(o);
      h.top = h.top || [];
      h.top.push({ ing: one.ing, st: one.st, cost: one.cost });
      sfx(ctx, 'plate', o);
      return 'ok';
    }
    return dry ? { blocked: `Well holds ${lc(stateInfo(w.ing, w.st).label)}` } : null;
  }

  if (t === 'rack') {
    if (!h) {
      if (o.n <= 0) return dry ? { blocked: 'No clean plates. Wash some!' } : null;
      if (dry) return `Take a plate (${o.n})`;
      o.n -= 1;
      p.hand = { k: 'plate', items: [] };
      sfx(ctx, 'plateclink', o);
      return 'ok';
    }
    if (h.k === 'plate' && !h.items.length) {
      if (dry) return 'Put the plate back';
      o.n += 1;
      p.hand = null;
      sfx(ctx, 'plateclink', o);
      return 'ok';
    }
    if (h.k === 'dirty') return dry ? { blocked: 'Dirty plates go to the sink' } : null;
    return null;
  }

  if (t === 'sink') {
    if (h && h.k === 'dirty') {
      if (dry) return `Drop ${h.n} dirty plate${h.n > 1 ? 's' : ''} in the sink`;
      o.n += h.n;
      p.hand = null;
      sfx(ctx, 'plateclink', o);
      return 'ok';
    }
    return null;
  }

  if (t === 'bin') {
    if (!h) {
      if ((o.trash || 0) < TRASH_CAPACITY) return dry ? { blocked: `Bin ${(o.trash || 0)}/${TRASH_CAPACITY}` } : null;
      if (dry) return 'Take out trash bag';
      p.hand = { k: 'trash', n: TRASH_CAPACITY };
      o.trash -= TRASH_CAPACITY;
      sfx(ctx, 'pick', o);
      return 'ok';
    }
    if (h.k === 'trash') {
      if (dry) return 'Return trash bag';
      returnTrashBag(S, h);
      p.hand = null;
      return 'ok';
    }
    if (h.k === 'dirty') return dry ? { blocked: 'Dirty plates go to the sink' } : null;
    if (h.k === 'plate' && !h.items.length) return dry ? { blocked: 'Put clean plates back on the rack' } : null;
    if ((o.trash || 0) >= TRASH_CAPACITY) return dry ? { blocked: 'Bin full. Take the bag out first.' } : null;
    if (h.k === 'plate') {
      if (dry) return 'Scrape the plate into the bin';
      waste(ctx, h);
      h.items = [];
      sfx(ctx, 'bin', o);
      return 'ok';
    }
    if (dry) return `Throw away ${lc(itemLabel(S, h))}`;
    waste(ctx, h);
    p.hand = null;
    sfx(ctx, 'bin', o);
    return 'ok';
  }

  if (t === 'drinks') {
    if (h) return dry ? { blocked: 'Hands full' } : null;
    if (dry) return 'Pour a drink';
    ctx.emit({ type: 'picker', to: pid, store: 'drinks', obj: o.id });
    return 'ok';
  }

  if (t === 'dock') {
    if (!h) {
      if (!o.boxes.length) return null;
      const b = o.boxes[o.boxes.length - 1];
      if (dry) return `Pick up a case of ${lc(ING[b.ing].name)}` + (o.boxes.length > 1 ? ` (${o.boxes.length} cases)` : '');
      o.boxes.pop();
      p.hand = { k: 'box', ing: b.ing };
      sfx(ctx, 'box', o);
      return 'ok';
    }
    if (h.k === 'box') {
      if (dry) return 'Put the case back';
      o.boxes.push({ ing: h.ing });
      p.hand = null;
      sfx(ctx, 'box', o);
      return 'ok';
    }
    return null;
  }

  if (t === 'host') {
    const r = greet(ctx, pid, dry);
    if (r) return r;
    if (followingParty(S, pid)) return dry ? { blocked: 'Lead them to a free table' } : null;
    return dry ? { blocked: 'Nobody waiting' } : null;
  }

  if (t === 'table') {
    if (followingParty(S, pid)) return seatAt(ctx, pid, o, dry);
    if (h && (h.k === 'plate' || h.k === 'drink') && o.party) {
      const r = serveTo(ctx, pid, o, h, dry);
      if (r && !dry && r === 'served') p.hand = null;
      return r;
    }
    if (o.dirty > 0 && (!h || h.k === 'dirty')) {
      if (h && h.n + o.dirty > 8) return dry ? { blocked: 'Too many plates to carry' } : null;
      if (dry) return `Clear ${o.dirty} dirty plate${o.dirty > 1 ? 's' : ''}`;
      creditWork(S, pid, 'bused', o.dirty);
      addTrash(S, o.dirty);
      if (h) h.n += o.dirty; else p.hand = { k: 'dirty', n: o.dirty };
      o.dirty = 0;
      sfx(ctx, 'plateclink', o);
      return 'ok';
    }
    if (!o.party && waitingParty(S) && !h) return dry ? { blocked: 'Greet guests at the host stand first' } : null;
    return null;
  }
  return null;
}

/** The raw state a station's step starts from (for adding portions). */
function stepFrom(s, t) {
  if (s.t > 0 || stepFor(s.ing, s.st, t)) return s.st;
  return null;
}

function wellPortion(o) {
  const w = o.well;
  const it = ingItem(w.ing, w.st, w.cost);
  it.heat = w.hot ? 0 : -1;
  it.q = w.q ?? 1;
  w.n -= 1;
  if (w.n <= 0) o.well = null;
  return it;
}

// ------------------------------------------------------------------ Space

function actSpace(ctx, pid, dt, dry, target) {
  const S = ctx.state;
  const p = S.players[pid];
  if (!p || playerArea(p) !== 'restaurant' || p.hand?.k === 'trash') return null;
  const o = target !== undefined ? target : findTarget(S, ctx.grid, p);
  if (!o) return null;
  if (o.type === 'board' && o.slot && o.slot.k === 'ing') {
    const step = stepFor(o.slot.ing, o.slot.st, 'board');
    if (!step) return null;
    if (dry) return `Hold to ${chopVerb(step)}`;
    const speed = S.upgrades.knife ? CFG.chopSpeedKnife : 1;
    o.slot.t += dt * speed * cookingMultiplier(S);
    p.working = o.id;
    if (o.slot.t >= step.t) {
      o.slot.st = step.to;
      o.slot.t = 0;
      sfx(ctx, 'chopdone', o);
    }
    return 'work';
  }
  if (o.type === 'sink' && o.n > 0) {
    const r = rack(S);
    if (dry) return `Hold to wash (${o.n})`;
    o.wash += dt / CFG.work.wash;
    p.working = o.id;
    if (o.wash >= 1) {
      o.wash = 0;
      o.n -= 1;
      r.n += 1;
      sfx(ctx, 'plateclink', o);
    }
    return 'work';
  }
  if (o.type === 'table' && o.party) {
    const r = tableWork(ctx, pid, o, dt, dry);
    if (r && !dry) p.working = o.id;
    return r;
  }
  return null;
}

function chopVerb(step) {
  const l = step.label.toLowerCase();
  if (l.includes('grated')) return 'grate';
  if (l.includes('minced')) return 'mince';
  if (l.includes('shredded')) return 'shred';
  if (l.includes('crumbled')) return 'crumble';
  if (l.includes('diced')) return 'dice';
  if (l.includes('wedge')) return 'cut wedges';
  if (l.includes('chopped')) return 'chop';
  return 'slice';
}

// ------------------------------------------------------------------ pickers and Q

function storeList(state, store) {
  const out = [];
  for (const [ing, d] of Object.entries(ING)) {
    if (d.store !== store) continue;
    const n = stockCount(state, ing);
    if (n > 0) out.push({ ing, n, name: d.name });
  }
  out.sort((a, b) => a.name.localeCompare(b.name));
  return out;
}

function near(ctx, p, o) {
  if (!o) return false;
  const cx = Math.max(o.x, Math.min(p.x, o.x + 1)), cz = Math.max(o.z, Math.min(p.z, o.z + 1));
  return Math.hypot(cx - p.x, cz - p.z) < CFG.move.reach + 0.6;
}

function takeFromStore(ctx, pid, objId, ing) {
  if (!ingredientAllowed(ctx.state, ing)) return;
  const S = ctx.state;
  const p = S.players[pid];
  const o = objById(S, objId);
  if (!p || playerArea(p) !== 'restaurant' || !o || !STORE_TYPES.has(o.type) || !near(ctx, p, o)) return false;
  if (!ING[ing] || ING[ing].store !== o.type) return false;
  if (!canReceive(p)) return false;
  const cost = takeStock(S, ing);
  if (cost == null) { ctx.emit({ type: 'toast', text: `Out of ${ING[ing].name.toLowerCase()}. Order more from the office or call a rush delivery.`, kind: 'bad', to: pid }); return false; }
  const it = ingItem(ing, 'raw', cost);
  if (!giveTo(ctx, p, it)) { returnStock(S, ing, cost); return false; }
  p.last = p.last || {};
  p.last[o.type] = ing;
  sfx(ctx, 'pick', o);
  return true;
}

function takeDrink(ctx, pid, objId, id) {
  const drink = drinkById(ctx.state, id);
  if (!drink || drinkRequirements(ctx.state, drink).length) return;
  const S = ctx.state;

/**
 * Procedural animation. s: { speed, dt, carrying, working, sitting, eating, t }
 */
function animatePerson(m, s) {
  const moving = Math.min(1, s.speed / 2.5);
  m.phase += s.dt * (3 + s.speed * 2.6);
  const swing = Math.sin(m.phase) * 0.7 * moving;
  if (s.sitting) {
    m.legs[0].rotation.x = -1.45; m.legs[1].rotation.x = -1.45;
    m.body.position.y = -0.32;
    m.body.position.z = -0.05;
  } else {
    m.legs[0].rotation.x = swing;
    m.legs[1].rotation.x = -swing;
    m.body.position.y = Math.abs(Math.sin(m.phase)) * 0.05 * moving;
    m.body.position.z = 0;
  }
  let la = 0, ra = 0;
  if (s.carrying) { la = -1.25; ra = -1.25; }
  else if (s.working) { const w = Math.sin(s.t * 18) * 0.35; la = -1.0 + w; ra = -1.1 - w; }
  else if (s.eating) { la = -0.5; ra = -0.9 - Math.max(0, Math.sin(s.t * 3 + m.phase)) * 0.7; }
  else if (s.sitting) { la = -0.6; ra = -0.6; }
  else { la = -swing * 0.8; ra = swing * 0.8; }
  m.arms[0].rotation.x += (la - m.arms[0].rotation.x) * Math.min(1, s.dt * 14);
  m.arms[1].rotation.x += (ra - m.arms[1].rotation.x) * Math.min(1, s.dt * 14);
  m.body.rotation.z = Math.sin(m.phase) * 0.03 * moving;
}
